name: TWS CD EKS Workflow

on:
  workflow_run:
    workflows: ["TWS CI Workflow"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA or 'latest')"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name demo-eks-webapp-v25

      - name: Install AWS Load Balancer Controller
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/aws-load-balancer-controller-eks"

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=demo-eks-webapp-v25 \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${ROLE_ARN}" \
            --wait --timeout 3m

          # Clear stale webhook certs so services can be created without TLS errors
          kubectl delete mutatingwebhookconfiguration aws-load-balancer-webhook --ignore-not-found
          kubectl delete validatingwebhookconfiguration aws-load-balancer-webhook --ignore-not-found
          kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=60s

      - name: Substitute image placeholder
        run: |
          sed -i "s|DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" \
            k8s/backend/deployment.yml \
            k8s/frontend/deployment.yml

      - name: Deploy base resources
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/secrets.yml

      - name: Deploy MySQL
        run: |
          kubectl apply -f k8s/mysql/
          kubectl rollout status statefulset/mysql -n skillpulse --timeout=300s

      - name: Deploy Backend and Frontend
        run: |
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/ingress.yml

      - name: Update image tags to exact SHA
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          kubectl set image deployment/backend \
            backend=${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${IMAGE_TAG} \
            -n skillpulse

          kubectl set image deployment/frontend \
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${IMAGE_TAG} \
            -n skillpulse

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend -n skillpulse --timeout=300s
          kubectl rollout status deployment/frontend -n skillpulse --timeout=300s

      - name: Print ALB URL
        run: |
          echo "Waiting 30s for ALB to provision..."
          sleep 30
          kubectl get ingress skillpulse-ingress -n skillpulse \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
